<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#141b27"/>
    </linearGradient>
    <linearGradient id="dumbbellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="8"/>
  
  <!-- Dumbbell Symbol -->
  <g transform="rotate(-45, 256, 256)" filter="url(#glow)">
    <!-- Main Shaft Bar -->
    <rect x="136" y="236" width="240" height="40" rx="10" fill="url(#dumbbellGrad)"/>
    
    <!-- Big Inner Weight Plates -->
    <rect x="166" y="176" width="36" height="160" rx="12" fill="url(#dumbbellGrad)"/>
    <rect x="310" y="176" width="36" height="160" rx="12" fill="url(#dumbbellGrad)"/>
    
    <!-- Medium Outer Weight Plates -->
    <rect x="116" y="196" width="32" height="120" rx="10" fill="url(#dumbbellGrad)" opacity="0.9"/>
    <rect x="364" y="196" width="32" height="120" rx="10" fill="url(#dumbbellGrad)" opacity="0.9"/>
    
    <!-- Lock Collars -->
    <rect x="96" y="226" width="16" height="60" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="400" y="226" width="16" height="60" rx="6" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
